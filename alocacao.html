<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alocação do time de Tecnologia · Portal PMO</title>
<style>
:root{
  --bg:#0C1B38;--side:#08142B;--surface:#11244A;--surface2:#183060;--surface3:#0E1F42;
  --line:rgba(224,224,224,.10);--line2:rgba(224,224,224,.22);
  --text:#E9EDF5;--muted:#A3AEC4;--hi:#fff;
  --cherry:#ED174F;--teal:#4697A8;--teal-l:#74BFCD;--green:#4FA36B;--amber:#E7B24A;--gray:#8A93A6;
  --livre:#4697A8;--ideal:#4FA36B;--sobre:#ED174F;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,"Segoe UI",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1500px;margin:0 auto;padding:18px 22px 50px}
.proto{display:inline-flex;gap:8px;align-items:center;background:rgba(231,178,74,.12);border:1px solid rgba(231,178,74,.4);color:#f3cf94;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.eyebrow{color:var(--cherry);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
h1{margin:2px 0 4px;font-size:27px;color:var(--hi)}
.sub{color:var(--muted);margin:0}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--surface2);border:1px solid var(--line2);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:13px;transition:.15s}
.btn:hover{border-color:var(--teal-l)}
.btn.primary{background:var(--cherry);border-color:var(--cherry);color:#fff}
.btn.primary:hover{background:#c90f40}
.btn.sm{padding:5px 12px;font-size:12px}
.btn.on{background:var(--teal);border-color:var(--teal);color:#fff}
.weeknav{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:14px;flex-wrap:wrap}
.weeknav b{font-size:15px;color:var(--hi)}
.weeknav .sp{flex:1}
.weeknav .next{color:var(--muted);font-size:12.5px}
.arrow{width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:var(--surface2);cursor:pointer;display:grid;place-items:center}
.arrow:disabled{opacity:.35;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.kpi b{display:block;font-size:26px;color:var(--hi);margin-top:2px}
.kpi span{color:var(--muted);font-size:12px}
.kpi.warn b{color:var(--cherry)}.kpi.ok b{color:var(--green)}.kpi.info b{color:var(--teal-l)}
.alerts{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.alerts h3{margin:0 0 8px;font-size:14px;color:var(--hi)}
.alerts ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.alerts li{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:6px}
.tabs{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:700}
.tab.on{color:var(--hi);border-color:var(--cherry)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 0;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:rgba(255,255,255,.03)}
.who{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;flex:0 0 auto}
.who b{display:block;color:var(--hi)}.who small{color:var(--muted);font-size:12px}
.papel{font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:2px 7px;border-radius:6px;background:rgba(70,151,168,.2);color:var(--teal-l);margin-left:6px}
.bar{position:relative;display:flex;height:26px;border-radius:7px;overflow:hidden;background:var(--surface3);min-width:260px}
.bar i{display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;color:#fff;border-right:1px solid rgba(12,27,56,.55);min-width:0;overflow:hidden;white-space:nowrap}
.bar .cap{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;opacity:.85}
.pct{font-weight:800;font-size:16px;color:var(--hi)}
.pct small{display:block;font-weight:600;font-size:11.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:800}
.pill.livre{background:rgba(70,151,168,.2);color:var(--teal-l)}
.pill.ideal{background:rgba(79,163,107,.2);color:#8fe0ab}
.pill.sobre{background:rgba(237,23,79,.2);color:#ff7d9c}
.delta{font-size:12.5px;font-weight:700}.delta.up{color:#ff9db3}.delta.dn{color:var(--teal-l)}.delta.eq{color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:12px 14px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.heat td.c{text-align:center;font-weight:800;border-left:1px solid var(--line);cursor:pointer}
.heat td.c.livre{background:rgba(70,151,168,.22)}.heat td.c.ideal{background:rgba(79,163,107,.22)}.heat td.c.sobre{background:rgba(237,23,79,.28)}
.heat td.c small{display:block;font-weight:600;font-size:11px;color:var(--muted)}
.heat tr.tot td{font-weight:800;background:var(--surface3)}
.projs{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px;padding:12px}
.pj{background:var(--surface3);border:1px solid var(--line);border-radius:14px;padding:14px}
.pj h4{margin:0 0 2px;color:var(--hi);display:flex;gap:8px;align-items:center}
.pj .sw{width:12px;height:12px;border-radius:4px}
.pj p{margin:0 0 10px;color:var(--muted);font-size:12.5px}
.pj .ln{display:grid;grid-template-columns:130px 1fr 58px;gap:8px;align-items:center;font-size:12.5px;margin:4px 0}
.pj .tr{height:8px;border-radius:6px;background:var(--surface);overflow:hidden}.pj .tr i{display:block;height:100%}
/* gaveta e modais */
.ov{position:fixed;inset:0;background:rgba(5,10,22,.65);z-index:50;display:none}
.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--surface);border-left:1px solid var(--line2);z-index:60;transform:translateX(105%);transition:.22s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer .body{padding:18px 20px;overflow:auto;flex:1}
.drawer footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted)}
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px}
input[type=text],input[type=number],input[type=time],input[type=search],input:not([type]),select{width:100%;background:var(--surface3);border:1px solid var(--line2);border-radius:9px;padding:8px 10px}
.al{display:grid;grid-template-columns:1fr 86px 30px;gap:8px;align-items:center;margin-bottom:8px}
.al .rm{background:none;border:0;color:var(--cherry);cursor:pointer;font-size:16px}
.live{background:var(--surface3);border-radius:12px;padding:12px 14px;margin-top:14px}
.modal{position:fixed;inset:0;z-index:70;display:none;place-items:center;padding:20px}
.modal.on{display:grid}
.modal .box{background:var(--surface);border:1px solid var(--line2);border-radius:16px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:22px 24px;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.modal .box.wide{width:min(900px,100%)}
.modal h3{margin:0 0 6px;font-size:19px;color:var(--hi)}
.modal .hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--surface3);border-radius:10px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--surface3);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
iframe.mail{width:100%;height:560px;border:1px solid var(--line2);border-radius:12px;background:#fff}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--line2);border-left:4px solid var(--cherry);padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
.diff td.up{color:#ff9db3;font-weight:700}.diff td.dn{color:var(--teal-l);font-weight:700}
@media(max-width:980px){.kpis{grid-template-columns:repeat(2,1fr)}.row2{grid-template-columns:1fr}.bar{min-width:160px}}
.seg{display:inline-flex;background:var(--surface3);border:1px solid var(--line2);border-radius:999px;padding:3px;gap:2px}.seg .btn{border:0;background:none;padding:5px 14px}.seg .btn.on{background:var(--teal);color:#fff}

.modnav{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin:0 0 18px}
.mod{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:10px 16px;cursor:pointer;text-align:left;min-width:250px}
.mod b{font-size:14px;color:var(--hi)}.mod small{font-size:12px;color:var(--muted)}
.mod.on{border-color:var(--cherry);background:color-mix(in srgb,var(--cherry) 12%,var(--surface));box-shadow:inset 0 -3px 0 var(--cherry)}
.modsrc{margin-left:auto;align-self:center;font-size:12px;color:var(--muted);max-width:330px}.modsrc b{color:var(--teal-l)}
.fbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:14px}
.fbar select,.fbar input[type=search]{width:auto;min-width:170px}
.fst{font-size:12px;font-weight:800;padding:4px 11px;border-radius:999px}
.fst.rasc{background:rgba(231,178,74,.18);color:#f3cf94}.fst.env{background:rgba(79,163,107,.2);color:#8fe0ab}
.fgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:12px}
.fp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.fp.erro{border-color:rgba(237,23,79,.6)}
.fp-h{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.fp-h .nm{flex:1;min-width:120px}.fp-h .nm b{display:block;color:var(--hi)}.fp-h .nm small{color:var(--muted);font-size:11.5px}
.fp-h select{width:auto;padding:5px 8px;font-size:12px}
.fp-forn{width:100%;margin:0 0 8px;font-size:12.5px;padding:6px 9px}
.fl{display:grid;grid-template-columns:minmax(0,1fr) 92px 78px 26px;gap:6px;align-items:center;margin-bottom:6px}
.fl input,.fl select{padding:6px 8px;font-size:12.5px}
.fl .rm{background:none;border:0;color:var(--cherry);cursor:pointer;font-size:15px}
.tot{font-weight:800;font-size:12px;padding:3px 10px;border-radius:999px}
.tot.ok{background:rgba(79,163,107,.2);color:#8fe0ab}.tot.no{background:rgba(237,23,79,.22);color:#ff8fa8}.tot.zero{background:var(--surface3);color:var(--muted)}
.cx{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:6px}.cx.c{background:rgba(70,151,168,.25);color:var(--teal-l)}.cx.o{background:rgba(195,147,102,.25);color:#e6bf96}
.fp .add{margin-top:2px}
.fres{width:100%;border-collapse:collapse;font-size:13px}.fres th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}.fres td{padding:7px 10px;border-bottom:1px solid var(--line)}.fres td.n{text-align:right;font-variant-numeric:tabular-nums}
.mail-f{display:grid;grid-template-columns:90px 1fr;gap:8px 10px;align-items:center;margin-bottom:10px}
.anx{display:inline-flex;gap:6px;align-items:center;background:var(--surface3);border:1px solid var(--line2);border-radius:10px;padding:6px 10px;font-size:12.5px;margin:0 6px 6px 0}
iframe.pdfv{width:100%;height:70vh;border:1px solid var(--line2);border-radius:12px;background:#e9edf3}
[hidden]{display:none!important}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.quick .btn{border-style:dashed}
.fq{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.fq .btn{border-style:dashed;font-size:11.5px;padding:4px 10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="proto" id="protoAviso" hidden></div>
  <div class="modnav">
    <button class="mod on" data-mod="placar"><b>Placar semanal</b><small>Horas por pessoa e projeto · e-mail ao time</small></button>
    <button class="mod" data-mod="fte"><b>Alocação FTE</b><small>% mensal CAPEX/OPEX · PDF para a contabilidade</small></button>
    <span class="modsrc">Time: pessoas com departamento <b>Tecnologia</b> no Cadastro de pessoas do portal<br><span id="visInfo"></span> <button class="btn sm" id="bVis" style="margin-top:6px">Pessoas exibidas</button></span>
  </div>
  <div id="mPlacar">
  <div class="top">
    <div>
      <div class="eyebrow">Administração · Time de Tecnologia</div>
      <h1>Placar de alocação</h1>
      <p class="sub">Horas por pessoa e projeto na semana, contra a capacidade de cada um. O PMO ajusta; o portal sugere a partir das tarefas dos projetos.</p>
    </div>
    <div class="acts">
      <button class="btn" id="bSug">Sugerir pelas tarefas</button>
      <button class="btn" id="bCfg">Disparo semanal</button>
      <button class="btn primary" id="bMail">Prévia do e-mail</button>
    </div>
  </div>

  <div class="weeknav">
    <div class="seg"><button class="btn sm on" data-nivel="semana">Semana</button><button class="btn sm" data-nivel="mes">Mês</button><button class="btn sm" data-nivel="ano">Ano</button></div>
    <button class="arrow" id="wPrev" aria-label="Semana anterior">‹</button>
    <b id="wLabel"></b>
    <button class="arrow" id="wNext" aria-label="Próxima semana">›</button>
    <span class="sp"></span>
    <span class="next" id="nextRun"></span>
  </div>

  <div class="kpis" id="kpis"></div>
  <div class="alerts" id="alerts"></div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-t="placar">Placar da semana</button>
    <button class="tab" data-t="heat">Próximas 4 semanas</button>
    <button class="tab" data-t="proj">Por projeto</button>
  </div>
  <div id="view"></div>
  </div>
  <div id="mFte" hidden></div>
</div>

<div class="ov" id="ov"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal" id="modal"></div>
<div id="toast"></div>

<script>
/* ---------------- dados do portal (passados pela página principal) ---------------- */
const API=(()=>{try{return parent&&parent!==window&&parent.ALOC_API?parent.ALOC_API:null;}catch(e){return null;}})();
const QS=new URLSearchParams(location.search);
const BOOT=API?API.dados():{hoje:new Date().toISOString().slice(0,10),time:[],projetos:[],tarefas:[],placar:null,fte:null,logo:"",url:"",usuario:"",email:""};
const HOJE=new Date(BOOT.hoje+"T12:00:00"),ANO=HOJE.getFullYear();
const CORES=["#4697A8","#ED174F","#C39366","#8a6fd1","#4FA36B","#E7B24A","#5B7BB8","#c0507a","#3E8E9A","#A87436","#2B8DA3","#7D879C"];
const PL=BOOT.placar&&typeof BOOT.placar==="object"?BOOT.placar:{};
PL.sem=PL.sem||{};PL.cap=PL.cap||{};PL.projNomes=PL.projNomes||{};PL.enviados=PL.enviados||{};
const PROJ={};
BOOT.projetos.forEach((p,i)=>{PROJ["p"+p.id]={n:p.nome,c:CORES[i%CORES.length],d:p.sub||""};});
PROJ.gpmo={n:"Gestão de Equipe - PMO",c:"#ED6A8C",d:"Gestão do time pelo PMO"};
PROJ.gsust={n:"Gestão de Equipe - Sustentação",c:"#7FA6D9",d:"Gestão do time de sustentação"};
PROJ.sust={n:"Sustentação",c:"#5B7BB8",d:"Suporte e incidentes"};
PROJ.ferias={n:"Férias",c:"#2FA39A",d:"Férias programadas"};
PROJ.aus={n:"Ausência (folga, atestado)",c:"#6E7A91",d:"Não disponível"};
const ATIV_TIME=["gpmo","gsust","sust","ferias","aus"];
function selAtiv(k,d){
  const op=x=>`<option value="${x}" ${x===k?"selected":""}>${esc(PROJ[x].n)}</option>`;
  const livre=x=>x===k||!(x in d);
  const at=ATIV_TIME.filter(livre),pj=Object.keys(PROJ).filter(x=>!ATIV_TIME.includes(x)&&livre(x));
  return `${at.length?`<optgroup label="Atividades do time">${at.map(op).join("")}</optgroup>`:""}${pj.length?`<optgroup label="Projetos">${pj.map(op).join("")}</optgroup>`:""}`;
}
Object.entries(PL.projNomes).forEach(([k,n],i)=>{if(!PROJ[k])PROJ[k]={n:n+" (encerrado)",c:"#77777A",d:"Projeto que saiu da gestão"};});
const PESSOAS_TODAS=BOOT.time.map((p,i)=>({id:p.email,nome:p.nome,papel:p.papel||"Usuário",cap:+PL.cap[p.email]||40,cor:CORES[i%CORES.length]}));
PL.vis=PL.vis||{}; /* {email:{placar:false,email:false}}: quem fica de fora do placar, das estatísticas e do e-mail */
const visPl=id=>!(PL.vis[id]&&PL.vis[id].placar===false);
const visMail=id=>PL.vis[id]&&"email" in PL.vis[id]?PL.vis[id].email!==false:visPl(id);
const PESSOAS=[];
function aplicarVis(){PESSOAS.length=0;PESSOAS_TODAS.filter(p=>visPl(p.id)).forEach(p=>PESSOAS.push(p));}
aplicarVis();
const isoAdd=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
const SEMANAS=[];
{const d=new Date(ANO,0,4,12);d.setDate(d.getDate()-((d.getDay()+6)%7));let ini=d.toISOString().slice(0,10);
 for(let n=1;n<=53;n++){const qui=new Date(isoAdd(ini,3)+"T12:00:00");if(qui.getFullYear()!==ANO)break;SEMANAS.push({n,ini,m:qui.getMonth()});ini=isoAdd(ini,7);}}
const semChave=w=>`${ANO}-${SEMANAS[w].n}`;
const sem={};SEMANAS.forEach((s,w)=>{sem[w]=PL.sem[semChave(w)]=PL.sem[semChave(w)]||{};});
const CFG=Object.assign({ativo:true,dia:1,hora:"08:00",assunto:"Placar de alocação · Semana {sem}",livre:60,sobre:100},PL.cfg||{});PL.cfg=CFG;
const CUR=Math.max(0,SEMANAS.findIndex(s=>BOOT.hoje>=s.ini&&BOOT.hoje<=isoAdd(s.ini,6)));
const S={nivel:"semana",w:CUR,m:HOJE.getMonth(),aba:"placar",edit:null,draft:null};
let plTimer=0;
function plSalvar(){
  Object.values(PL.sem).forEach(pp=>Object.values(pp).forEach(a=>Object.keys(a).forEach(k=>{if(/^p/.test(k)&&PROJ[k])PL.projNomes[k]=PROJ[k].n.replace(/ \(encerrado\)$/,"");})));
  PESSOAS_TODAS.forEach(p=>{PL.cap[p.id]=p.cap;});
  clearTimeout(plTimer);plTimer=setTimeout(()=>{if(API)API.salvar("placar",PL).catch(e=>toast("Não salvou no SharePoint: "+(e.message||e)));},500);
}
/* ---------------- utilitários ---------------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ini=n=>n.split(" ").map(x=>x[0]).slice(0,2).join("");
const fmtD=d=>d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
const addDias=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d;};
const semLabel=w=>`Semana ${SEMANAS[w].n} · ${fmtD(addDias(SEMANAS[w].ini,0))} a ${fmtD(addDias(SEMANAS[w].ini,6))}`;
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const W=x=>Array.isArray(x)?x:[x];
const TODAS=SEMANAS.map((_,i)=>i);
const mesSems=m=>TODAS.filter(i=>SEMANAS[i].m===m);
const tot=(ws,id)=>W(ws).reduce((a,w)=>a+Object.values(sem[w][id]||{}).reduce((x,y)=>x+(+y||0),0),0);
const capW=(ws,p)=>p.cap*W(ws).length;
const pct=(ws,p)=>Math.round(tot(ws,p.id)/capW(ws,p)*100);
const projsOf=(ws,id)=>{const o={};W(ws).forEach(w=>Object.entries(sem[w][id]||{}).forEach(([k,h])=>{o[k]=(o[k]||0)+h;}));return o;};
const NOME={semana:"semana",mes:"mês",ano:"ano"};
function wsAtual(){return S.nivel==="semana"?[S.w]:S.nivel==="mes"?mesSems(S.m):TODAS;}
function wsVizinho(d){
  if(S.nivel==="semana"){const x=S.w+d;return x>=0&&x<SEMANAS.length?[x]:null;}
  if(S.nivel==="mes"){const x=S.m+d;return x>=0&&x<12?mesSems(x):null;}
  return null;
}
function rotulo(){
  if(S.nivel==="semana")return semLabel(S.w)+(S.w===CUR?"  (semana do próximo disparo)":"");
  if(S.nivel==="mes"){const l=mesSems(S.m);return `${MESES[S.m]} de ${ANO} · ${l.length} semanas (${SEMANAS[l[0]].n} a ${SEMANAS[l[l.length-1]].n})`;}
  return `Ano de ${ANO} · ${SEMANAS.length} semanas`;
}
const stOf=v=>v>CFG.sobre?"sobre":v<CFG.livre?"livre":"ideal";
const ST={livre:"Com folga",ideal:"Ideal",sobre:"Sobrecarga"};
const stCor={livre:"var(--livre)",ideal:"var(--ideal)",sobre:"var(--sobre)"};
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),3200);}
const DIAS=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
const agora=()=>API&&API.agora?API.agora():new Date();
/* data/hora do disparo desta semana e do próximo */
function disparoDaSemana(w){const d=new Date(SEMANAS[w].ini+"T00:00:00");d.setDate(d.getDate()+((CFG.dia+6)%7));const [h,mi]=(CFG.hora||"08:00").split(":");d.setHours(+h||0,+mi||0,0,0);return d;}
function proxDisparo(){
  const n=agora();let w=CUR;if(PL.enviados[semChave(CUR)]||disparoDaSemana(CUR)<n)w=Math.min(SEMANAS.length-1,CUR+1);
  const d=disparoDaSemana(w);return `${DIAS[d.getDay()]}, ${fmtD(d)} às ${CFG.hora}`+(PL.enviados[semChave(CUR)]?` · semana ${SEMANAS[CUR].n} enviada em ${PL.enviados[semChave(CUR)]}`:"");
}

/* ---------------- barra empilhada ---------------- */
function barra(ws,p){
  const a=projsOf(ws,p.id),t=tot(ws,p.id),cp=capW(ws,p),escala=Math.max(t,cp,1);
  const segs=Object.entries(a).filter(([,h])=>h>0).sort((x,y)=>y[1]-x[1]).map(([pj,h])=>{
    const wd=h/escala*100;
    return `<i style="width:${wd}%;background:${PROJ[pj].c}" title="${esc(PROJ[pj].n)}: ${h}h">${wd>9?h+"h":""}</i>`;
  }).join("");
  const marca=t>cp?`<span class="cap" style="left:${cp/escala*100}%" title="Capacidade ${cp}h"></span>`:"";
  return `<div class="bar">${segs}${marca}</div>`;
}

/* ---------------- render ---------------- */
function render(){
  if(!PESSOAS.length){$("kpis").innerHTML="";$("alerts").innerHTML=`<h3>Nenhuma pessoa no time de Tecnologia</h3><span class="sub">O placar usa as pessoas com departamento <b>Tecnologia</b> no Cadastro de pessoas (Base › Cadastro de pessoas). Ajuste o departamento de quem faz parte do time e abra esta página de novo.</span>`;$("view").innerHTML="";$("wLabel").textContent=rotulo();return;}
  const ws=wsAtual(),nv=S.nivel,N=NOME[nv];
  $("wLabel").textContent=rotulo();
  $("wPrev").disabled=!wsVizinho(-1);$("wNext").disabled=!wsVizinho(1);
  document.querySelectorAll("[data-nivel]").forEach(b=>b.classList.toggle("on",b.dataset.nivel===nv));
  $("nextRun").textContent=CFG.ativo?`Próximo e-mail: ${proxDisparo()}`:"Disparo semanal desativado";
  const cap=PESSOAS.reduce((a,p)=>a+capW(ws,p),0),al=PESSOAS.reduce((a,p)=>a+tot(ws,p.id),0);
  const sob=PESSOAS.filter(p=>stOf(pct(ws,p))==="sobre"),liv=PESSOAS.filter(p=>stOf(pct(ws,p))==="livre");
  const livH=liv.reduce((a,p)=>a+(capW(ws,p)-tot(ws,p.id)),0);
  const oc=Math.round(al/cap*100);
  $("kpis").innerHTML=`
    <div class="kpi"><small>Capacidade do time</small><b>${cap}h</b><span>${PESSOAS.length} pessoas${ws.length>1?" · "+ws.length+" semanas":""}</span></div>
    <div class="kpi info"><small>Alocado</small><b>${al}h</b><span>${oc}% de ocupação</span></div>
    <div class="kpi ${sob.length?"warn":"ok"}"><small>Em sobrecarga</small><b>${sob.length}</b><span>acima de ${CFG.sobre}% da capacidade</span></div>
    <div class="kpi info"><small>Com folga</small><b>${liv.length}</b><span>${livH}h livres (abaixo de ${CFG.livre}%)</span></div>
    <div class="kpi ${oc>100?"warn":"ok"}"><small>Equilíbrio do time</small><b>${PESSOAS.length-sob.length-liv.length}/${PESSOAS.length}</b><span>na faixa ideal</span></div>`;
  const al2=[],prox=wsVizinho(1);
  PESSOAS.forEach(p=>{
    const v=pct(ws,p),t=tot(ws,p.id),cp=capW(ws,p),s=stOf(v);
    const nSob=ws.length>1?ws.filter(w=>stOf(pct(w,p))==="sobre").length:0;
    const rec=s==="sobre"&&prox&&stOf(pct(prox,p))==="sobre";
    if(s==="sobre")al2.push(`<li><i class="dot" style="background:var(--sobre)"></i><span><b>${esc(p.nome)}</b> está com ${t}h de ${cp}h (${v}%): excede ${t-cp}h.${nSob?` Ficou acima do limite em ${nSob} de ${ws.length} semanas.`:""}${rec?` <b>Sobrecarga também no próximo ${N}.</b>`:""}</span></li>`);
    else if(s==="livre")al2.push(`<li><i class="dot" style="background:var(--livre)"></i><span><b>${esc(p.nome)}</b> tem ${cp-t}h livres (${v}% ocupado): pode absorver demanda.</span></li>`);
    else if(nSob>=Math.max(3,Math.ceil(ws.length*.25)))al2.push(`<li><i class="dot" style="background:var(--amber)"></i><span><b>${esc(p.nome)}</b> está na faixa ideal na média, mas teve ${nSob} semanas acima do limite.</span></li>`);
  });
  const semNinguem=Object.keys(PROJ).filter(k=>/^p\d/.test(k)&&BOOT.projetos.some(x=>"p"+x.id===k)&&!PESSOAS.some(p=>(projsOf(ws,p.id))[k]>0));
  if(semNinguem.length)al2.push(`<li><i class="dot" style="background:var(--amber)"></i><span><b>${semNinguem.length} projeto(s) em andamento</b> sem ninguém alocado neste ${N}: ${semNinguem.slice(0,6).map(k=>esc(PROJ[k].n)).join(", ")}${semNinguem.length>6?` e mais ${semNinguem.length-6}`:""}.</span></li>`);
  $("alerts").innerHTML=`<h3>Pontos de atenção</h3>${al2.length?`<ul>${al2.join("")}</ul>`:`<span class="sub">Nada fora da faixa neste ${N}.</span>`}`;
  const nomes={semana:["Placar da semana","Próximas 4 semanas"],mes:["Placar do mês","Semana a semana"],ano:["Placar do ano","Mês a mês"]}[nv];
  const tb=document.querySelectorAll(".tab");tb[0].textContent=nomes[0];tb[1].textContent=nomes[1];
  tb.forEach(t=>t.classList.toggle("on",t.dataset.t===S.aba));
  $("view").innerHTML=S.aba==="placar"?viewPlacar(ws):S.aba==="heat"?viewHeat():viewProj(ws);
}
function viewPlacar(ws){
  const nv=S.nivel,prev=wsVizinho(-1),agg=nv!=="semana";
  const linhas=PESSOAS.slice().sort((a,b)=>pct(ws,b)-pct(ws,a)).map(p=>{
    const v=pct(ws,p),s=stOf(v);
    let d='<span class="delta eq">—</span>';
    if(prev){const dd=v-pct(prev,p);d=dd===0?'<span class="delta eq">= igual</span>':`<span class="delta ${dd>0?"up":"dn"}">${dd>0?"▲":"▼"} ${Math.abs(dd)} p.p.</span>`;}
    const nSob=ws.filter(w=>stOf(pct(w,p))==="sobre").length;
    return `<tr class="row" ${agg?`data-detalhe="1"`:`data-edit="${p.id}"`}>
      <td><div class="who"><span class="av" style="background:${p.cor}">${ini(p.nome)}</span><div><b>${esc(p.nome)}<span class="papel">${esc(p.papel)}</span></b><small>capacidade ${p.cap}h/semana${agg?` · ${capW(ws,p)}h no período`:""}</small></div></div></td>
      <td>${barra(ws,p)}</td>
      <td><div class="pct">${v}%<small>${tot(ws,p.id)}h de ${capW(ws,p)}h</small></div></td>
      <td><span class="pill ${s}">${ST[s]}</span></td>
      <td>${d}</td>
      ${agg?`<td><span class="delta ${nSob?"up":"eq"}">${nSob} de ${ws.length}</span></td><td><button class="btn sm" data-detalhe="1">Ver detalhe</button></td>`:`<td><button class="btn sm" data-edit="${p.id}">Editar</button></td>`}</tr>`;
  }).join("");
  const usados=Object.keys(PROJ).filter(k=>PESSOAS.some(p=>(projsOf(ws,p.id))[k]>0));
  const cmp={semana:"semana anterior",mes:"mês anterior",ano:"período anterior"}[nv];
  return `<div class="card"><table><thead><tr><th>Pessoa</th><th>Alocação por projeto (horas)</th><th>Ocupação</th><th>Situação</th><th>vs. ${cmp}</th>${agg?"<th>Semanas em sobrecarga</th>":""}<th></th></tr></thead><tbody>${linhas}</tbody></table>
  <div class="legend">${usados.map(k=>`<span><i style="background:${PROJ[k].c}"></i>${esc(PROJ[k].n)}</span>`).join("")}<span><i style="background:#fff;width:3px"></i>limite da capacidade</span>${agg?`<span>Ocupação = horas alocadas ÷ capacidade de todas as semanas do ${NOME[nv]}.</span>`:""}</div></div>`;
}
function viewHeat(){
  const nv=S.nivel;
  let cols;
  if(nv==="semana"){const l=[];for(let i=0;i<4&&S.w+i<SEMANAS.length;i++)l.push(S.w+i);cols=l.map(w=>({ws:[w],h:`Sem. ${SEMANAS[w].n}<br><span style="text-transform:none;letter-spacing:0">${fmtD(addDias(SEMANAS[w].ini,0))}</span>`,go:`semana:${w}`}));}
  else if(nv==="mes")cols=mesSems(S.m).map(w=>({ws:[w],h:`Sem. ${SEMANAS[w].n}<br><span style="text-transform:none;letter-spacing:0">${fmtD(addDias(SEMANAS[w].ini,0))}</span>`,go:`semana:${w}`}));
  else cols=MESES.map((n,m)=>({ws:mesSems(m),h:n.slice(0,3),go:`mes:${m}`}));
  const head=cols.map(c=>`<th style="text-align:center">${c.h}</th>`).join("");
  const rows=PESSOAS.map(p=>`<tr><td><div class="who"><span class="av" style="background:${p.cor}">${ini(p.nome)}</span><b>${esc(p.nome)}</b></div></td>${cols.map(c=>{const v=pct(c.ws,p);return `<td class="c ${stOf(v)}" data-goto="${c.go}">${v}%<small>${tot(c.ws,p.id)}h</small></td>`;}).join("")}</tr>`).join("");
  const med=cols.map(c=>{const cp=PESSOAS.reduce((a,p)=>a+capW(c.ws,p),0),a=PESSOAS.reduce((x,p)=>x+tot(c.ws,p.id),0);return `<td class="c" style="text-align:center">${Math.round(a/cp*100)}%<small>${a}h</small></td>`;}).join("");
  const dica=nv==="ano"?"Clique num mês para abrir.":"Clique numa célula para abrir a semana.";
  return `<div class="card heat"><table><thead><tr><th>Pessoa</th>${head}</tr></thead><tbody>${rows}<tr class="tot"><td>Time</td>${med}</tr></tbody></table>
  <div class="legend"><span><i style="background:rgba(70,151,168,.6)"></i>Com folga (&lt; ${CFG.livre}%)</span><span><i style="background:rgba(79,163,107,.6)"></i>Ideal</span><span><i style="background:rgba(237,23,79,.7)"></i>Sobrecarga (&gt; ${CFG.sobre}%)</span><span>${dica}</span></div></div>`;
}
function viewProj(ws){
  const cards=Object.keys(PROJ).map(k=>{
    const ps=PESSOAS.map(p=>({p,h:projsOf(ws,p.id)[k]||0})).filter(x=>x.h>0).sort((a,b)=>b.h-a.h);
    const t=ps.reduce((a,x)=>a+x.h,0);
    if(!t)return "";
    const mx=Math.max(...ps.map(x=>x.h));
    return `<div class="pj"><h4><i class="sw" style="background:${PROJ[k].c}"></i>${esc(PROJ[k].n)}</h4><p>${t}h · ${ps.length} pessoa(s) · ${PROJ[k].d}${ws.length>1?` · média de ${Math.round(t/ws.length)}h por semana`:""}</p>
      ${ps.map(x=>`<div class="ln"><span>${esc(x.p.nome)}</span><div class="tr"><i style="width:${x.h/mx*100}%;background:${PROJ[k].c}"></i></div><b>${x.h}h</b></div>`).join("")}</div>`;
  }).join("");
  return `<div class="card"><div class="projs">${cards}</div></div>`;
}

}

  $("drawer").innerHTML=`<header><div class="who"><span class="av" style="background:${p.cor}">${ini(p.nome)}</span><div><b>${esc(p.nome)}</b><small style="color:var(--muted)">${semLabel(S.w)}</small></div></div><button class="x" data-fechar>×</button></header>

function modalSug(){
  if(S.nivel!=="semana"){toast("A sugestão e a edição são feitas na visão semanal.");return;}
  const w=S.w,ini=SEMANAS[w].ini,fim=isoAdd(ini,6),sug={},base={};
  PESSOAS.forEach(p=>{
    const ts=(BOOT.tarefas||[]).filter(t=>t.email===p.id&&(!t.ini||t.ini<=fim)&&(!t.fim||t.fim>=ini));
    base[p.id]=ts.length;
    const porP={};ts.forEach(t=>{const k="p"+t.pid;porP[k]=(porP[k]||0)+1;});
    const at=sem[w][p.id]||{},aus=(at.aus||0)+(at.ferias||0),livre=Math.max(0,p.cap-aus),n=ts.length;
    sug[p.id]={};if(at.aus)sug[p.id].aus=at.aus;if(at.ferias)sug[p.id].ferias=at.ferias;
    if(n)Object.entries(porP).forEach(([k,c])=>{if(PROJ[k])sug[p.id][k]=Math.round(livre*c/n);});
    else Object.assign(sug[p.id],sem[w][p.id]||{});
  });
  S.sug=sug;
  const linhas=PESSOAS.map(p=>{const a=tot(w,p.id),b=Object.values(sug[p.id]).reduce((x,y)=>x+y,0),dd=b-a;
    return `<tr class="diff"><td><b>${esc(p.nome)}</b></td><td>${a}h</td><td>${b}h</td><td class="${dd>0?"up":dd<0?"dn":""}">${dd>0?"+":""}${dd}h</td><td style="color:var(--muted);font-size:12px">${base[p.id]?`${base[p.id]} tarefa(s) abertas na semana como responsável ou apoio`:"sem tarefas na semana: mantém o lançado"}</td></tr>`;}).join("");
  abrirModal(`<h3>Sugestão a partir das tarefas</h3><p class="hint">Para cada pessoa, o portal pega as tarefas abertas em que ela é responsável ou apoio e que caem nesta semana, e divide a capacidade (menos ausências) entre os projetos na proporção das tarefas. Revise antes de aplicar.</p>
  <table><thead><tr><th>Pessoa</th><th>Lançado</th><th>Sugerido</th><th>Diferença</th><th>Base</th></tr></thead><tbody>${linhas}</tbody></table>
  <div class="mfoot"><button class="btn" data-fm>Descartar</button><button class="btn primary" id="sAplicar">Aplicar sugestão na ${semLabel(w).split(" · ")[0].toLowerCase()}</button></div>`,true);
}
/* envio do placar: um e-mail por pessoa, com a linha dela destacada */
async function plEnviar(w,apenasEu){
  if(!API){toast("Abra esta página pelo portal para enviar.");return {ok:0,erro:1};}
  const ass=CFG.assunto.replace("{sem}",SEMANAS[w].n);
  const alvos=apenasEu?[{id:BOOT.email,nome:BOOT.usuario||"Você"}]:PESSOAS_TODAS.filter(p=>p.id&&visMail(p.id));
  let ok=0,erros=[];
  for(const p of alvos){
    try{const r=await API.enviarEmail({para:[p.id],assunto:ass,html:htmlEmail(w,PESSOAS.some(x=>x.id===p.id)?p.id:null)});if(r&&r.ok)ok++;else erros.push(p.nome+": "+((r&&r.erro)||"falhou"));}
    catch(e){erros.push(p.nome+": "+(e.message||e));}
  }
  if(!apenasEu&&ok){PL.enviados[semChave(w)]=agora().toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});plSalvar();}
  return {ok,erro:erros.length,erros};
}

document.addEventListener("click",e=>{

  const nvb=t.closest("[data-nivel]");
  if(nvb){const n=nvb.dataset.nivel;if(n==="mes"&&S.nivel==="semana")S.m=SEMANAS[S.w].m;if(n==="semana"&&S.nivel==="mes"&&SEMANAS[S.w].m!==S.m)S.w=mesSems(S.m)[0];S.nivel=n;S.aba="placar";render();return;}
  if(t.closest("#wPrev")){if(S.nivel==="semana")S.w=Math.max(0,S.w-1);else if(S.nivel==="mes")S.m=Math.max(0,S.m-1);render();return;}
  if(t.closest("#wNext")){if(S.nivel==="semana")S.w=Math.min(SEMANAS.length-1,S.w+1);else if(S.nivel==="mes")S.m=Math.min(11,S.m+1);render();return;}
  if(t.closest("[data-detalhe]")){S.aba="heat";render();return;}
  const tab=t.closest(".tab");if(tab){S.aba=tab.dataset.t;render();return;}
  const g=t.closest("[data-goto]");if(g){const [k,v]=g.dataset.goto.split(":");if(k==="semana"){S.w=+v;S.nivel="semana";}else{S.m=+v;S.nivel="mes";}S.aba="placar";render();return;}
  const ed=t.closest("[data-edit]");if(ed){abrirEdicao(ed.dataset.edit);return;}
  if(t.closest("[data-fechar]")||t.id==="ov"){fecharEdicao();return;}
  if(t.closest("[data-fm]")){fecharModal();return;}
  if(t.id==="modal"){fecharModal();return;}
  if(t.closest("#bCfg")){modalCfg();return;}
  if(t.closest("#bMail")){modalMail();return;}
  if(t.closest("#bSug")){modalSug();return;}
  if(t.id==="cSalvar"){
    CFG.ativo=$("cAtivo").checked;CFG.dia=+$("cDia").value;CFG.hora=$("cHora").value||"08:00";CFG.assunto=$("cAss").value||CFG.assunto;
    const l=+$("cLiv").value,s=+$("cSob").value;if(l<s){CFG.livre=l;CFG.sobre=s;}
    plSalvar();fecharModal();render();toast("Configuração salva.");return;
  }
  if(t.id==="mCopia"){const h=$("mIf").srcdoc;(navigator.clipboard?navigator.clipboard.writeText(h):Promise.reject()).then(()=>toast("HTML do e-mail copiado.")).catch(()=>toast("Não foi possível copiar neste ambiente."));return;}
  if(t.id==="mTeste"){if(!BOOT.email){toast("Conecte a conta Microsoft no portal para enviar o teste.");return;}t.disabled=true;t.textContent="Enviando…";const wm=S.nivel==="semana"?S.w:CUR;plEnviar(wm,true).then(r=>{t.disabled=false;t.textContent="Enviar teste para mim";toast(r.ok?`Teste enviado para ${BOOT.email}.`:"Não enviou: "+((r.erros||[])[0]||""));});return;}
  if(t.id==="mEnviar"){const wm=S.nivel==="semana"?S.w:CUR;t.disabled=true;t.textContent="Enviando…";plEnviar(wm,false).then(r=>{fecharModal();render();toast(r.erro?`Enviado a ${r.ok} pessoa(s); ${r.erro} com erro: ${r.erros[0]}`:`Placar da semana ${SEMANAS[wm].n} enviado a ${r.ok} pessoa(s).`);});return;}
  if(t.id==="sAplicar"){PESSOAS.forEach(p=>{const a=sem[S.w];Object.keys(a[p.id]||{}).forEach(k=>delete a[p.id][k]);a[p.id]=Object.assign(a[p.id]||{},S.sug[p.id]);});plSalvar();fecharModal();render();toast("Sugestão aplicada à semana.");return;}
  if(t.id==="eAdd"){const livres=Object.keys(PROJ).filter(k=>!(k in S.draft)&&!ATIV_TIME.includes(k));if(livres.length){S.draft[livres[0]]=4;drawEdit();}return;}
  const qk=t.closest("[data-quick]");if(qk&&S.draft){const pq=PESSOAS.find(x=>x.id===S.edit);S.draft[qk.dataset.quick]=qk.dataset.quick==="ferias"?Math.max(0,pq.cap-Object.entries(S.draft).reduce((a,[k,v])=>a+(+v||0),0))||pq.cap:4;drawEdit();const n=document.querySelector(`[data-h="${qk.dataset.quick}"]`);if(n){n.focus();n.select();}return;}
  const rm=t.closest("[data-rm]");if(rm){delete S.draft[rm.dataset.rm];drawEdit();return;}
  if(t.id==="eSalvar"){
    const p=PESSOAS.find(x=>x.id===S.edit);const c=+$("eCap").value;if(c>0)p.cap=c;
    const lim={};Object.entries(S.draft).forEach(([k,h])=>{if(+h>0)lim[k]=+h;});sem[S.w][S.edit]=lim;plSalvar();
    fecharEdicao();render();toast(`Alocação de ${p.nome} salva.`);return;
  }
});

function fPlanilhas(){
  const det=[["Mês","Nome","fornecedor","valor","valor_gerencial","Regime","Capex/Opex","%Alocação","Produto_"]];
  for(let mm=0;mm<=F.m;mm++) fTime().forEach(n=>fLinhas(mm,n).forEach(x=>det.push([`${String(mm+1).padStart(2,"0")}.${MESES_F[mm].slice(0,3)}`,n,FTE.pessoas[n].forn||"","","",FTE.pessoas[n].reg||"",x[1],x[2],x[0]])));
  const mapa=[["Mês",`${String(F.m+1).padStart(2,"0")}.${MESES_F[F.m].slice(0,3)}`],[],["Regime","Pessoa","Fornecedor","Produto","CAPEX","OPEX"]];
  ["PJ","CLT",""].forEach(rg=>fTime().filter(n=>(FTE.pessoas[n].reg||"")===rg).forEach(n=>fLinhas(F.m,n).forEach(x=>mapa.push([rg||"—",n,FTE.pessoas[n].forn||"",x[0],x[1]==="CAPEX"?x[2]:"",x[1]==="OPEX"?x[2]:""]))));
  const ms=[...Array(F.m+1).keys()];
  const ano=[["Pessoa","Capex/Opex","Produto",...ms.map(mm=>`${String(mm+1).padStart(2,"0")}.${MESES_F[mm].slice(0,3)}`),"Total Geral"]];
  fTime().forEach(n=>{const ch={};ms.forEach(mm=>fLinhas(mm,n).forEach(x=>{const k=x[1]+"|"+x[0].trim();ch[k]=ch[k]||Array(F.m+1).fill("");ch[k][mm]=(+ch[k][mm]||0)+x[2];}));
    Object.keys(ch).sort().forEach(k=>ano.push([n,k.split("|")[0],k.split("|")[1],...ch[k],ch[k].reduce((a,b)=>a+(+b||0),0)]));});
  return [{nome:"Detalhado",linhas:det,pct:[7]},{nome:"MAPA FTE",linhas:mapa,pct:[4,5]},{nome:"%Alocação",linhas:ano,pct:ms.map(x=>x+3).concat(F.m+3)}];
}
const fArq=()=>`Alocacao_FTE_${FTE.ano}-${String(F.m+1).padStart(2,"0")}`;
async function fCsv(){
  if(!API){toast("Abra esta página pelo portal para exportar.");return;}

/* PDF de verdade: cada página do documento vira uma página A4 (html2canvas + jsPDF do portal) */
let fLibsOk=false;
function fLibs(){
  if(fLibsOk)return;
  const L=API.libs();[L.h2c,L.jspdf].forEach(src=>{const sc=document.createElement("script");sc.textContent=src;document.head.appendChild(sc);});fLibsOk=true;
}
async function fGerarPdf(){
  fLibs();
  const host=document.createElement("iframe");host.style.cssText="position:fixed;left:-30000px;top:0;width:900px;height:1200px;border:0";document.body.appendChild(host);
  host.srcdoc=fPdfHtml(F.m);await new Promise(r=>host.onload=r);await new Promise(r=>setTimeout(r,150));
  const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"portrait",compress:true});
  const pgs=[...host.contentDocument.querySelectorAll(".pg")];let primeira=true;
  for(const pg of pgs){
    pg.style.margin="0";pg.style.boxShadow="none";
    const cv=await window.html2canvas(pg,{scale:1.6,backgroundColor:"#ffffff",windowWidth:900});
    const pxPorPag=Math.floor(cv.width*297/210);
    for(let y=0;y<cv.height-4;y+=pxPorPag){
      const h=Math.min(pxPorPag,cv.height-y),c=document.createElement("canvas");c.width=cv.width;c.height=h;
      c.getContext("2d").drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
      if(!primeira)doc.addPage();primeira=false;
      doc.addImage(c.toDataURL("image/jpeg",.86),"JPEG",0,0,210,h*210/cv.width);
    }
  }
  host.remove();
  return doc;
}
async function fBaixarPdf(){
  if(!API){toast("Abra esta página pelo portal para gerar o PDF.");return;}
  toast("Gerando o PDF…");
  try{const doc=await fGerarPdf();doc.save(fArq()+".pdf");toast("PDF gerado.");}catch(e){toast("Não foi possível gerar o PDF: "+(e.message||e));}
}
async function fMandar(btn){
  if(!API){toast("Abra esta página pelo portal para enviar.");return;}
  const para=$("fPara").value.split(/[;,\s]+/).filter(x=>/@/.test(x));
  if(!para.length){toast("Informe o e-mail da contabilidade.");return;}
  const RR=fResumo(F.m);
  if(!RR.pessoas){toast(`Não há alocação lançada em ${MESES_F[F.m].toLowerCase()}. Use "Copiar do mês anterior" ou preencha antes de enviar.`);return;}
  if(RR.pend.length&&!confirm(`${RR.pend.length} pessoa(s) não fecham 100% (${RR.pend.join(", ")}). Enviar mesmo assim?`))return;
  FTE.para=para.join("; ");btn.disabled=true;btn.textContent="Gerando PDF…";
  try{
    const doc=await fGerarPdf(),pdfB64=doc.output("datauristring").split(",")[1];
    btn.textContent="Gerando planilha…";
    const xls=await API.xlsxBase64(fPlanilhas());
    btn.textContent="Enviando…";
    const corpo=$("fMsg").value;
    const r=await API.enviarEmail({para,cc:[API.pmoEmail()],assunto:$("fAss").value,html:`<div style="font-family:Segoe UI,Arial,sans-serif;font-size:14px;color:#1B2740;white-space:pre-wrap">${esc(corpo)}</div>`,
      anexos:[{nome:fArq()+".pdf",tipo:"application/pdf",b64:pdfB64},{nome:fArq()+".xlsx",tipo:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",b64:xls}]});
    if(!r||!r.ok)throw new Error((r&&r.erro)||"o Outlook recusou o envio");
    FTE.enviado[F.m]=agora().toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});fSalvar();
    fecharModal();renderFte();toast(`Enviado a ${para.join(", ")} com o PDF e a planilha.`);
  }catch(e){btn.disabled=false;btn.textContent="Enviar pelo Outlook";toast("Não foi possível enviar: "+(e.message||e));}
}

function fModo(mod){
  document.querySelectorAll(".mod").forEach(b=>b.classList.toggle("on",b.dataset.mod===mod));
  $("mPlacar").hidden=mod!=="placar";$("mFte").hidden=mod!=="fte";
  if(mod==="fte")renderFte();else render();
}
document.addEventListener("click",e=>{
  const t=e.target;
  const md=t.closest("[data-mod]");if(md){fModo(md.dataset.mod);return;}
  if($("mFte").hidden&&!t.closest("#modal"))return;
  if(t.closest("#fPrev")){F.m=Math.max(0,F.m-1);renderFte();return;}
  if(t.closest("#fNext")){F.m=Math.min(11,F.m+1);renderFte();return;}
  if(t.closest("#fPdf")||t.closest("#fVerPdf")){fModalPdf();return;}
  if(t.closest("#fEnviar")||t.closest("#fEnviar2")){fModalMail();return;}
  if(t.closest("#fCsv")){fCsv();return;}
  if(t.closest("#fBaixar")){fBaixarPdf();return;}
  if(t.closest("#fMandar")){fMandar(t.closest("#fMandar"));return;}
  if(t.closest("#fCopiar")){
    if(F.m===0){toast("Janeiro não tem mês anterior.");return;}
    const ant=FTE.meses[F.m-1],cur=FTE.meses[F.m];let n=0;
    fTime().forEach(p=>{if(!(cur[p]||[]).length&&(ant[p]||[]).length){cur[p]=JSON.parse(JSON.stringify(ant[p]));n++;}});
    fSalvar();renderFte();toast(n?`${n} pessoa(s) copiadas de ${MESES_F[F.m-1].toLowerCase()}. Ajuste o que mudou.`:"Todas as pessoas já têm alocação neste mês: nada foi sobrescrito.");return;
  }
  const card=t.closest("[data-fp]");if(!card)return;
  const n=card.dataset.fp,l=(FTE.meses[F.m][n]=FTE.meses[F.m][n]||[]);
  const fg=t.closest("[data-fgest]");if(fg){l.push([fg.dataset.fgest,fCxPadrao(fg.dataset.fgest),0]);fSalvar();renderFte();const c=document.querySelector(`[data-fp="${CSS.escape(n)}"] [data-fpct="${l.length-1}"]`);if(c){c.focus();c.select();}return;}
  if(t.closest("[data-fadd]")){l.push(["","CAPEX",0]);fSalvar();renderFte();const c=document.querySelector(`[data-fp="${CSS.escape(n)}"] [data-fprod="${l.length-1}"]`);if(c)c.focus();return;}
  const rm=t.closest("[data-frm]");if(rm){l.splice(+rm.dataset.frm,1);fSalvar();renderFte();}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(e.target.closest&&e.target.closest("[data-fp]"))setTimeout(fSalvar,0);
  if(t.id==="fMes"){F.m=+t.value;renderFte();return;}
  if(t.id==="fReg"){F.reg=t.value;renderFte();return;}
  if(t.id==="fPend"){F.pend=t.checked;renderFte();return;}
  const card=t.closest&&t.closest("[data-fp]");if(!card)return;
  const n=card.dataset.fp,l=FTE.meses[F.m][n]||[];
  if(t.dataset.freg!==undefined){const pp=FTE.pessoas[n];pp.reg=t.value;if(t.value==="CLT"&&!(pp.forn||"").trim()&&n.includes(" ")){pp.forn=n.toUpperCase();toast(`Razão social preenchida com o nome do Cadastro: ${pp.forn}.`);}renderFte();return;}
  if(t.dataset.fforn!==undefined){FTE.pessoas[n].forn=t.value;return;}
  if(t.dataset.fprod!==undefined){const i=+t.dataset.fprod;l[i][0]=t.value;if(!l[i][2]||l[i][1]==="CAPEX")l[i][1]=fCxPadrao(t.value);renderFte();return;}
  if(t.dataset.fcx!==undefined){l[+t.dataset.fcx][1]=t.value;renderFte();return;}
  if(t.dataset.fpct!==undefined){l[+t.dataset.fpct][2]=Math.max(0,Math.min(100,+t.value||0))/100;renderFte();return;}
});
